<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#00477a" />
    <meta name="robots" content="noindex" />
    <title>You are offline | Mazandaran Official Justice Experts Council</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f4f7fa;
        color: #0b2943;
        font-family: Tahoma, Arial, sans-serif;
        padding: 22px;
      }
      main {
        max-width: 520px;
        width: 100%;
        background: white;
        border: 1px solid #dae5ef;
        border-radius: 25px;
        padding: 36px;
        text-align: center;
        box-shadow: 0 12px 40px #12395512;
      }
      img {
        width: 86px;
        height: 86px;
        border-radius: 20px;
      }
      h1 {
        font-size: 24px;
        line-height: 1.8;
        margin: 20px 0 10px;
      }
      p {
        font-size: 14px;
        line-height: 2;
        color: #64748b;
      }
      a {
        display: inline-block;
        text-decoration: none;
        color: white;
        background: #00477a;
        border-radius: 12px;
        padding: 13px 22px;
        margin-top: 16px;
        font-size: 14px;
      }
      small {
        display: block;
        font-size: 11px;
        line-height: 2;
        color: #64748b;
        margin-top: 25px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1926;
          color: #e6f1fc;
        }
        main {
          background: #142333;
          border-color: #304457;
        }
        p,
        small {
          color: #b3c4d4;
        }
      }
      @media (max-width: 380px) {
        main {
          padding: 27px 20px;
        }
        h1 {
          font-size: 21px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/pwa/icon-192.png"
        alt="Mazandaran Official Justice Experts Council"
        width="86"
        height="86"
      />
      <h1>You are offline</h1>
      <p>
        Reconnect to view council news, documents and expert information. You
        can keep using the installed web app once your connection returns.
      </p>
      <a href="/en/">Try again</a
      ><small>Mazandaran Official Justice Experts Council</small>
    </main>
  </body>
</html>
